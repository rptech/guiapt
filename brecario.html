<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berçário 2026/2027</title>
    <style>
        :root {
            --primary: #1a5276;
            --secondary: #2980b9;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --entrada-bg: #fef9e7;
            --saida-bg: #ebf5fb;
        }
        body { font-family: Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: #333; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: border-box; }

        h2 { text-align: center; color: var(--primary); margin: 5px 0 2px 0; font-size: 18px; }
        .subtitle { text-align: center; font-size: 12px; color: #555; margin-bottom: 10px; }
        
        /* Abas */
        .tabs { display: flex; justify-content: center; margin-bottom: 10px; gap: 4px; flex-wrap: wrap; }
        .tab-btn { background: #bdc3c7; border: none; padding: 8px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; color: #fff; }
        .tab-btn.active { background: var(--primary); }

        .container { background: var(--card-bg); padding: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; width: 100%; }
        
        /* Seletores (Dia e Criança) */
        .selector-box { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; background: #eaf2f8; padding: 10px; border-radius: 6px; }
        .selector-row { display: flex; align-items: center; justify-content: space-between; }
        .selector-box label { font-weight: bold; font-size: 13px; color: var(--primary); width: 35%; }
        .selector-box select { padding: 8px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; background: #fff; font-weight: bold; color: var(--primary); width: 65%; }

        /* Cartão de Registo */
        .card-registo { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: center; }
        .card-registo h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 16px; }

        /* CAIXAS LADO A LADO ALTAS E GRANDES */
        .time-group-large { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
        .time-box-large { flex: 1; display: flex; flex-direction: column; }
        .time-box-large label { font-size: 11px; color: #555; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        
        .time-box-large input[type="text"] { 
            border: 2px solid #ccc; 
            border-radius: 8px; 
            padding: 14px 4px;
            font-size: 26px;
            letter-spacing: 1px;
            text-align: center; 
            width: 100%; 
            font-weight: bold; 
        }
        
        .col-entrada input { background-color: var(--entrada-bg); color: #9a7d0a; border-color: #f1c40f;height: 40px; width: 100%; font-size: 26px; }
        .col-saida input { background-color: var(--saida-bg); color: #154360; border-color: #5499c7; height: 40px; width: 100%; font-size: 26px;}
